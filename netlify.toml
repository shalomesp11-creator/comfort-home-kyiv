[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/.netlify/functions/lead"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
